<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Musubi — Mobil Simülatör</title>
<link rel="icon" href="/assets/musubi-logo.png">
<link rel="stylesheet" href="./app.css">
</head>
<body>

<div class="stage">
  <div class="stage-side">
    <div class="stage-brand">
      <img src="/assets/musubi-logo.png" alt="">
      <div>
        <b>Musubi</b>
        <span>mobil simülatör</span>
      </div>
    </div>
    <p class="stage-note">Gerçek API'ye bağlıdır. Ekranlar 04.08.2026 Figma revizyonuna göre çizilmiştir.</p>

    <div class="dev-bar" id="dev-bar" hidden>
      <div class="dev-head">Geliştirici</div>
      <div class="dev-email" id="dev-email"></div>
      <button data-dev="fresh">Yeni test hesabı</button>
      <button data-dev="reset">Oturumu sıfırla</button>
    </div>
  </div>

  <div class="phone" id="phone" data-theme="light">
    <div class="phone-frame">
      <div class="island"></div>
      <div class="statusbar">
        <span class="clock">9:41</span>
        <span class="sysicons">
          <svg viewBox="0 0 18 12" width="17"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="4.5" y="5.5" width="3" height="6.5" rx="1"/><rect x="9" y="3" width="3" height="9" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1"/></svg>
          <svg viewBox="0 0 16 12" width="16"><path d="M8 10.2a1.3 1.3 0 1 0 0 .1zM4.6 7.3a4.8 4.8 0 0 1 6.8 0l1.2-1.2a6.5 6.5 0 0 0-9.2 0zM1.4 4.1a9.3 9.3 0 0 1 13.2 0l1.2-1.2a11 11 0 0 0-15.6 0z"/></svg>
          <svg viewBox="0 0 26 12" width="25"><rect x="0.5" y="0.5" width="21" height="11" rx="3.2" fill="none" stroke-width="1"/><rect x="2" y="2" width="18" height="8" rx="2"/><path d="M23 4.2v3.6a2 2 0 0 0 0-3.6z"/></svg>
        </span>
      </div>

      <div class="viewport">
        <div class="screen" id="screen"></div>
        <div id="tabbar-slot"></div>
        <div id="sheet-slot"></div>
        <div id="toasts"></div>
      </div>
    </div>
  </div>
</div>

<script src="./app.js"></script>
</body>
</html>
