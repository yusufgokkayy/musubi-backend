<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Musubi — Mobil Simülatör</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧧</text></svg>">
<link rel="stylesheet" href="./app.css">
</head>
<body>

<div class="stage">
  <div class="stage-tag">musubi · gerçek API'ye bağlı mobil simülatör</div>
  <div class="phone" id="phone" data-theme="light">
    <div class="notch"></div>
    <div class="statusbar">
      <span>9:41</span>
      <span class="icons">▂▄▆█ 📶 🔋</span>
    </div>
    <div class="phone-body">
      <div class="screen" id="screen"></div>
      <div id="tabbar-slot"></div>
    </div>
    <div id="modal-slot"></div>
  </div>
</div>

<div class="dev-bar" id="dev-bar" hidden>
  <div><b>dev</b> — <span id="dev-email"></span></div>
  <div class="row">
    <button data-dev="reset">Sıfırla (çıkış)</button>
    <button data-dev="fresh">Yeni test hesabı</button>
  </div>
</div>

<script src="./app.js"></script>
</body>
</html>
